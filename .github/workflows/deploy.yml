name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy on vm-fluentia-01
        env:
          SHA: ${{ github.sha }}
        run: |
          cat > deploy.sh <<EOF
          set -eu
          cd /opt/fluentia/app
          sudo -H -u fluentia git fetch --quiet origin main
          sudo -H -u fluentia git reset --hard "$SHA"
          VENV_OWNER=\$(stat -c %U /opt/fluentia/venv)
          sudo -H -u "\$VENV_OWNER" /opt/fluentia/venv/bin/pip install --quiet -r requirements.txt
          systemctl restart fluentia-api fluentia-bot
          sleep 5
          systemctl is-active fluentia-api fluentia-bot
          echo "DEPLOY_OK \$(sudo -H -u fluentia git rev-parse --short HEAD)"
          EOF
          out=$(az vm run-command invoke -g rg-fluentia-prod -n vm-fluentia-01 --command-id RunShellScript --scripts @deploy.sh --query "value[0].message" -o tsv)
          echo "$out"
          grep -q "DEPLOY_OK" <<< "$out"

      - name: Check site responds
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" --retry 5 --retry-delay 5 --retry-all-errors https://fluentia.heart2heartchildrens.com/
